name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meddonish/api test
      - run: pnpm --filter @meddonish/localization test
      - run: pnpm --filter @meddonish/api lint
      - run: pnpm --filter @meddonish/web lint
      - run: pnpm --filter @meddonish/admin lint
      - run: pnpm --filter @meddonish/api build
      - run: pnpm audit --prod --audit-level=critical
